# Install on the server as:
#   /etc/nginx/sites-available/polycon.ryxtech.in.conf
# then symlink into sites-enabled/ and run certbot to add the 443 block.
#
# Modelled on the existing acadrix.ryxtech.in.conf, minus the Django parts --
# Polycon is a static SPA with no backend, so there is no proxy_pass and no
# pm2 process.

server {
    server_name polycon.ryxtech.in;

    root /var/www/polycon/dist;
    index index.html;

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or browsers keep loading old asset hashes
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
